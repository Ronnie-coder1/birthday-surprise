<style>
:root {
  --bg: #030705;
  --bg-forest: #06140c;
  --emerald-950: #05160d;
  --emerald-900: #0a2919;
  --emerald-700: #115934;
  --emerald-500: #1ec96f;
  --emerald-400: #36e588;
  --gold-100: #fcf3de;
  --gold-300: #f2d593;
  --gold-400: #dfbe78;
  --gold-600: #a67f37;
  --text: #f5f8f5;
  --text-soft: #d2dfd6;
  --muted: #8fa698;
  --glass: rgba(8, 25, 15, 0.68);
  --glass-border: rgba(223, 190, 120, 0.24);
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.22, 1.28, 0.36, 1);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  min-height: 100%;
  background: var(--bg);
  scroll-behavior: smooth;
  overflow-x: hidden;
  overflow-x: clip;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  overflow-x: clip;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* =========================================================
   ATMOSPHERIC BACKDROP (Static Multi-Layer Gradients + Grain)
========================================================= */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(80% 55% at 50% 6%, rgba(17, 89, 52, 0.45) 0%, rgba(7, 30, 18, 0.22) 48%, transparent 78%),
    radial-gradient(48% 42% at 88% 18%, rgba(223, 190, 120, 0.11) 0%, transparent 72%),
    radial-gradient(54% 48% at 12% 84%, rgba(16, 76, 44, 0.35) 0%, transparent 74%),
    radial-gradient(circle at 50% 48%, #07190f 0%, #030705 76%);
}

.bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 45%, transparent 42%, rgba(2, 5, 3, 0.68) 100%);
}

.grain {
  position: absolute;
  inset: 0;
  opacity: 0.04;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

canvas#fx {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 40;
  pointer-events: none;
}

/* =========================================================
   GIFT GATE (Luxury Unwrapping Experience)
========================================================= */
body:not(.open) {
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
}

.gate {
  position: fixed;
  inset: 0;
  z-index: 25;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(22px, 4.2vh, 36px);
  padding: calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
  cursor: pointer;
  user-select: none;
  background:
    radial-gradient(75% 52% at 50% 45%, rgba(18, 78, 46, 0.56) 0%, rgba(6, 22, 13, 0.88) 46%, #030705 84%);
  transition: opacity 0.72s var(--ease-out-expo), transform 0.72s var(--ease-out-expo), visibility 0.72s;
}

.gate::before {
  content: "";
  position: absolute;
  inset: clamp(14px, 3vw, 28px);
  border-radius: 24px;
  border: 1px solid rgba(223, 190, 120, 0.16);
  box-shadow: inset 0 0 60px rgba(30, 201, 111, 0.04);
  pointer-events: none;
}

.gate:focus-visible {
  outline: 2px solid var(--gold-300);
  outline-offset: -8px;
}

.gate.is-gone {
  display: none;
}

body.open .gate {
  opacity: 0;
  transform: scale(1.045);
  visibility: hidden;
  pointer-events: none;
}

.gate-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  border-radius: 999px;
  border: 1px solid rgba(223, 190, 120, 0.28);
  background: rgba(8, 28, 17, 0.65);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--gold-300);
  opacity: 0;
  animation: gateFadeUp 0.7s 0.08s var(--ease-out-expo) forwards;
}

.gate-eyebrow::before,
.gate-eyebrow::after {
  content: "";
  width: 4px;
  height: 4px;
  transform: rotate(45deg);
  background: var(--gold-300);
  opacity: 0.85;
}

.gift-stage {
  position: relative;
  width: 220px;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  animation: gatePop 0.9s 0.18s var(--ease-out-expo) forwards;
}

.gift-aura {
  position: absolute;
  inset: -18px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(242, 213, 147, 0.28) 0%, rgba(30, 201, 111, 0.22) 38%, transparent 70%);
  animation: auraBreath 3.2s ease-in-out infinite;
  pointer-events: none;
}

.gift-spark {
  position: absolute;
  color: var(--gold-300);
  pointer-events: none;
  animation: sparkTwinkle 2.6s ease-in-out infinite;
}

.gift-spark.s1 { top: 20px; left: 16px; width: 14px; height: 14px; animation-delay: 0s; }
.gift-spark.s2 { top: 34px; right: 14px; width: 11px; height: 11px; animation-delay: 0.9s; color: var(--emerald-400); }
.gift-spark.s3 { bottom: 44px; left: 8px; width: 10px; height: 10px; animation-delay: 1.7s; }

.gift {
  position: relative;
  width: 168px;
  height: 164px;
  transform-origin: center bottom;
  animation: giftFloat 3.4s ease-in-out infinite;
  transition: transform 0.35s var(--ease-out-expo);
  filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.65));
}

.gift-floor {
  position: absolute;
  bottom: -10px;
  left: 50%;
  width: 158px;
  height: 20px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0, 0, 0, 0.8) 0%, transparent 72%);
  transition: transform 0.5s ease, opacity 0.5s ease;
  pointer-events: none;
}

.gift-bloom {
  position: absolute;
  left: 50%;
  bottom: 94px;
  width: 150px;
  height: 175px;
  transform: translateX(-50%) scaleY(0.18);
  transform-origin: bottom center;
  background: radial-gradient(ellipse at bottom, rgba(252, 243, 222, 0.96) 0%, rgba(242, 213, 147, 0.56) 36%, rgba(30, 201, 111, 0.22) 66%, transparent 82%);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.62s var(--ease-out-expo), opacity 0.4s ease;
}

.gate:hover .gift {
  transform: translateY(-4px) scale(1.025);
}

.gate:hover .lid {
  transform: translateY(-6px) rotate(-1.8deg);
}

.gate.is-opening .gift {
  animation: none;
  transform: scale(0.95);
}

.gate.is-opening .gift-aura {
  transform: scale(1.42);
  opacity: 0.95;
  transition: transform 0.55s var(--ease-out-expo), opacity 0.4s ease;
}

.gate.is-opening .gift-bloom {
  opacity: 1;
  transform: translateX(-50%) scaleY(1.22) scaleX(1.32);
}

.gate.is-opening .gift-floor {
  transform: translateX(-50%) scale(0.84);
  opacity: 0.45;
}

.box {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 0;
  height: 102px;
  border-radius: 6px 6px 16px 16px;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0%, transparent 18%, transparent 82%, rgba(0, 0, 0, 0.28) 100%),
    linear-gradient(150deg, #176c3f 0%, #0d4527 52%, #072615 100%);
  border: 1px solid rgba(242, 213, 147, 0.26);
  box-shadow:
    inset 0 12px 18px -6px rgba(0, 0, 0, 0.58),
    inset 0 -8px 18px rgba(0, 0, 0, 0.35);
  overflow: hidden;
}

.box::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 28px;
  transform: translateX(-50%);
  background: linear-gradient(90deg, #9d762f 0%, #e8c77f 32%, #fcf1d4 50%, #d2a650 72%, #8e6825 100%);
  box-shadow: 0 0 14px rgba(242, 213, 147, 0.28);
}

.box::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 14px;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.52), transparent);
}

.lid {
  position: absolute;
  left: 4px;
  right: 4px;
  bottom: 94px;
  height: 44px;
  border-radius: 10px;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, 0.08) 0%, transparent 20%, transparent 80%, rgba(0, 0, 0, 0.24) 100%),
    linear-gradient(150deg, #218b52 0%, #115833 58%, #0a361e 100%);
  border: 1px solid rgba(242, 213, 147, 0.38);
  box-shadow:
    inset 0 2px 3px rgba(255, 255, 255, 0.18),
    inset 0 -2px 0 rgba(242, 213, 147, 0.24),
    0 8px 18px rgba(0, 0, 0, 0.45);
  transition: transform 0.78s cubic-bezier(0.24, 1.32, 0.38, 1), opacity 0.65s ease;
}

.lid::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 30px;
  transform: translateX(-50%);
  border-radius: 2px;
  background: linear-gradient(90deg, #a27a32 0%, #f0d394 35%, #fff5dc 50%, #d7ab54 70%, #946d28 100%);
}

.bow {
  position: absolute;
  left: 50%;
  top: -28px;
  width: 78px;
  height: 34px;
  transform: translateX(-50%);
  pointer-events: none;
}

.bow-loop {
  position: absolute;
  bottom: 3px;
  width: 35px;
  height: 27px;
  border-radius: 60% 60% 25% 60%;
  background: linear-gradient(135deg, #fff2d3 0%, #e7c275 45%, #9d7530 100%);
  border: 1px solid rgba(255, 244, 214, 0.45);
  box-shadow: inset 0 -4px 8px rgba(96, 65, 16, 0.45), 0 4px 10px rgba(0, 0, 0, 0.35);
}

.bow-loop.left {
  left: 5px;
  transform: rotate(-18deg);
}

.bow-loop.right {
  right: 5px;
  border-radius: 60% 60% 60% 25%;
  transform: rotate(18deg);
}

.bow-tail {
  position: absolute;
  bottom: -11px;
  width: 12px;
  height: 17px;
  background: linear-gradient(180deg, #e7c275 0%, #9c742e 100%);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%);
}

.bow-tail.left {
  left: 24px;
  transform: rotate(16deg);
}

.bow-tail.right {
  right: 24px;
  transform: rotate(-16deg);
}

.bow-knot {
  position: absolute;
  left: 50%;
  bottom: 1px;
  width: 18px;
  height: 16px;
  transform: translateX(-50%);
  border-radius: 7px;
  background: linear-gradient(145deg, #fff4da 0%, #dfbe78 52%, #9a722d 100%);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
}

body.open .lid,
.gate.is-opening .lid {
  transform: translateY(-136px) rotate(-16deg) scale(1.04);
  opacity: 0;
}

.gate-copy {
  text-align: center;
  opacity: 0;
  animation: gateFadeUp 0.75s 0.26s var(--ease-out-expo) forwards;
}

.gate-title {
  font-family: "Playfair Display", Georgia, serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(2rem, 8.5vw, 2.75rem);
  line-height: 1.15;
  background: linear-gradient(120deg, #ffffff 15%, var(--gold-300) 55%, #ffffff 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.gate-sub {
  margin-top: 12px;
  font-size: 0.74rem;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
}

/* =========================================================
   MAIN BIRTHDAY EXPERIENCE
========================================================= */
.page-shell {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: clamp(22px, 3.6vh, 42px) clamp(18px, 4vw, 36px) clamp(24px, 3.6vh, 36px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.65s var(--ease-out-expo), visibility 0.65s;
}

body.open .page-shell {
  opacity: 1;
  visibility: visible;
}

main {
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* DATE BADGE */
.date-wrap {
  opacity: 0;
  transform: translateY(16px);
}

body.open .date-wrap {
  animation: riseIn 0.85s 0.1s var(--ease-out-expo) forwards;
}

.date {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 7px 17px;
  border-radius: 999px;
  border: 1px solid rgba(223, 190, 120, 0.34);
  background: rgba(8, 28, 17, 0.7);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.08),
    0 10px 26px -10px rgba(0, 0, 0, 0.7);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.32em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--gold-100);
}

.date-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--emerald-400);
  box-shadow: 0 0 10px var(--emerald-400);
  flex-shrink: 0;
}

/* HERO SECTION */
.hero {
  position: relative;
  width: min(78vw, 320px);
  margin: 22px auto 0;
  isolation: isolate;
}

.hero-halo {
  position: absolute;
  inset: -14%;
  z-index: -2;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(30, 201, 111, 0.24) 0%, rgba(223, 190, 120, 0.1) 40%, transparent 70%);
  opacity: 0;
  transform: scale(0.86);
  transition: transform 0.65s var(--ease-out-expo), opacity 0.65s ease;
  pointer-events: none;
}

body.open .hero-halo {
  animation: haloReveal 1.2s 0.2s var(--ease-out-expo) forwards;
}

main.celebrating .hero-halo {
  transform: scale(1.16);
  opacity: 1;
}

/* Clean, Uncluttered Portrait Frame (No gold attachments) */
.frame {
  position: relative;
  z-index: 2;
  aspect-ratio: 3 / 4;
  perspective: 1100px;
  border-radius: 22px;
  opacity: 0;
  transform: translateY(24px) scale(0.94);
}

body.open .frame {
  animation: frameReveal 1s 0.26s var(--ease-out-expo) forwards;
}

.photo {
  --rx: 0deg;
  --ry: 0deg;
  --mx: 50%;
  --my: 30%;
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 22px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: #07120c;
  box-shadow:
    0 30px 60px -16px rgba(0, 0, 0, 0.9),
    0 0 44px -18px rgba(30, 201, 111, 0.25);
  transform: rotateY(var(--ry)) rotateX(var(--rx));
  transform-style: preserve-3d;
  transition: transform 0.22s ease-out, box-shadow 0.45s ease, border-color 0.45s ease;
  touch-action: pan-y;
  overflow: hidden;
  cursor: pointer;
}

main.celebrating .photo {
  border-color: rgba(54, 229, 136, 0.36);
  box-shadow:
    0 32px 66px -12px rgba(0, 0, 0, 0.92),
    0 0 54px -10px rgba(30, 201, 111, 0.4);
}

.photo-inner {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(135deg, #091d12 0%, #050d08 100%);
}

.photo-inner::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(115deg, transparent 25%, rgba(242, 213, 147, 0.08) 50%, transparent 75%);
  transition: opacity 0.4s ease;
  pointer-events: none;
}

.photo-inner.is-loaded::before {
  opacity: 0;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 18%;
  display: block;
  opacity: 0;
  transform: scale(1.05);
  transition: opacity 0.55s ease, transform 1.4s var(--ease-out-expo);
}

.photo-inner.is-loaded img {
  opacity: 1;
  transform: scale(1);
}

.photo-glare {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(circle at var(--mx) var(--my), rgba(252, 243, 222, 0.16) 0%, rgba(252, 243, 222, 0.03) 36%, transparent 62%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, transparent 28%, transparent 68%, rgba(3, 8, 5, 0.46) 100%);
}

.photo-sweep {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background: linear-gradient(112deg, transparent 32%, rgba(252, 243, 222, 0.28) 50%, transparent 68%);
  transform: translateX(-125%);
}

.photo.sweep .photo-sweep {
  animation: sweepLight 0.95s var(--ease-out-expo) forwards;
}

/* =========================================================
   EDITORIAL CONTENT COLUMN
========================================================= */
.content-col {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  margin-top: clamp(22px, 4.2vw, 32px);
  opacity: 0;
  transform: translateY(18px);
}

body.open h1 {
  animation: riseIn 0.9s 0.48s var(--ease-out-expo) forwards;
}

h1 .script {
  display: block;
  font-family: "Playfair Display", Georgia, serif;
  font-style: italic;
  font-weight: 800;
  font-size: clamp(2.45rem, 11vw, 3.6rem);
  line-height: 1.03;
  letter-spacing: -0.015em;
  padding: 0 4px 4px;
  background: linear-gradient(110deg, #ffffff 8%, var(--gold-300) 48%, #fff8e7 78%, var(--gold-400) 100%);
  background-size: 180% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.5));
}

body.open h1 .script {
  animation: sheenOnce 1.8s 0.68s var(--ease-out-expo) forwards;
}

h1 .plain {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  margin-top: 8px;
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.44em;
  text-indent: 0.44em;
  text-transform: uppercase;
  color: var(--muted);
}

h1 .plain::before,
h1 .plain::after {
  content: "";
  width: 24px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(223, 190, 120, 0.5));
}

h1 .plain::after {
  background: linear-gradient(90deg, rgba(223, 190, 120, 0.5), transparent);
}

.name {
  display: block;
  margin-top: 10px;
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--emerald-400);
}

.name:empty {
  display: none;
}

/* LEVEL TERMINAL CHIP */
.level {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-radius: 14px;
  background: rgba(7, 24, 15, 0.76);
  border: 1px solid rgba(54, 229, 136, 0.24);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.05),

  -webkit-backdrop-filter: blur(10px);

  transform: translateY(16px);

body.open .level {

.level-led {

/* GLASS MESSAGE CARD */
.msg-card {
  position: relative;

  width: 100%;
  max-width: 390px;

}

.msg-card::before {
  content: "";

  left: 50%;

  height: 2px;
  transform: translateX(-50%);

.btn {

  padding: 14px 20px;

  width: 19px;
  height: 19px;
  flex-shrink: 0;
}

.btn::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.24) 50%, transparent 70%);
  transform: translateX(-120%);
  transition: transform 0.65s var(--ease-out-expo);
  pointer-events: none;
}

.btn:hover {

.btn:active {

.btn:focus-visible {

.btn.primary {

<script>
(() => {
  "use strict";

  /* ============ EDIT THESE ============ */

  const NAME = "";
  const WHATSAPP = "233509419901";
  const WISH_TXT = "Happy birthday! 🎉🎂";
  const MESSAGE = "";

  /* ==================================== */

  const $ = id => document.getElementById(id);
  const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* PERSONAL DETAILS */
  if (NAME) {
    $("name").textContent = NAME;
  }
  if (MESSAGE) {
    $("msg").textContent = MESSAGE;
  }

  /* WHATSAPP LINK */
  if (WHATSAPP) {
    const wishBtn = $("wish");
    wishBtn.hidden = false;
    wishBtn.href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(WISH_TXT)}`;
  }

  /* IMAGE LOAD & DECODE */
  const photoInner = $("photoInner");
  const img = photoInner.querySelector("img");

  function markImageLoaded() {
    photoInner.classList.add("is-loaded");
  }

  if (img.complete && img.naturalWidth > 0) {
    if (typeof img.decode === "function") {
      img.decode().catch(() => {}).finally(markImageLoaded);
    } else {
      markImageLoaded();
    }
  } else {
    img.addEventListener("load", markImageLoaded, { once: true });
    img.addEventListener("error", () => {
      const fallback = document.createElement("div");
      fallback.textContent = "Add photo.jpeg next to this file";
      fallback.style.cssText =
        "height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#8fa698;padding:24px;font-size:0.9rem;";
      img.replaceWith(fallback);
      markImageLoaded();
    }, { once: true });
  }

  /* TYPEWRITER */
  const levelLine = "> new level unlocked ✔";
  const typedOut = $("typed");
  let typingTimer = null;

  function startTyping() {
    clearTimeout(typingTimer);
    if (reducedMotion) {
      typedOut.textContent = levelLine;
      return;
    }

    let index = 0;
    typedOut.textContent = "";

    function step() {
      index++;
      typedOut.textContent = levelLine.slice(0, index);
      if (index < levelLine.length) {
        typingTimer = setTimeout(step, 34);
      }
    }

    typingTimer = setTimeout(step, 620);
  }

  /* ON-DEMAND 3D TILT & SPECULAR LIGHTING */
  const photoEl = $("photo");

  function setTilt(nx, ny) {
    if (reducedMotion) return;
    const rx = (-ny * 8.5).toFixed(2);
    const ry = (nx * 9.5).toFixed(2);
    const mx = ((nx + 0.5) * 100).toFixed(1);
    const my = ((ny + 0.5) * 100).toFixed(1);

    photoEl.style.setProperty("--rx", `${rx}deg`);
    photoEl.style.setProperty("--ry", `${ry}deg`);
    photoEl.style.setProperty("--mx", `${mx}%`);
    photoEl.style.setProperty("--my", `${my}%`);
  }

  function resetTilt() {
    photoEl.style.setProperty("--rx", "0deg");
    photoEl.style.setProperty("--ry", "0deg");
    photoEl.style.setProperty("--mx", "50%");
    photoEl.style.setProperty("--my", "30%");
  }

  window.addEventListener("pointermove", e => {
    if (!document.body.classList.contains("open")) return;
    if (e.pointerType === "touch" && !e.target.closest("#photo")) return;

    const nx = e.clientX / window.innerWidth - 0.5;
    const ny = e.clientY / window.innerHeight - 0.5;
    setTilt(nx, ny);
  }, { passive: true });

  window.addEventListener("pointerleave", resetTilt, { passive: true });
  window.addEventListener("pointerup", e => {
    if (e.pointerType === "touch") resetTilt();
  }, { passive: true });
  window.addEventListener("pointercancel", resetTilt, { passive: true });

  window.addEventListener("deviceorientation", e => {
    if (e.gamma == null || e.beta == null || !document.body.classList.contains("open")) return;
    const nx = Math.max(-0.5, Math.min(0.5, e.gamma / 45));
    const ny = Math.max(-0.5, Math.min(0.5, (e.beta - 45) / 60));
    setTilt(nx, ny);
  }, { passive: true });

  /* PORTRAIT TAP SHIMMER */
  photoEl.addEventListener("animationend", e => {
    if (e.animationName === "sweepLight") {
      photoEl.classList.remove("sweep");
    }
  });

  photoEl.addEventListener("click", e => {
    if (!document.body.classList.contains("open")) return;
    photoEl.classList.remove("sweep");
    void photoEl.offsetWidth;
    photoEl.classList.add("sweep");

    const rect = photoEl.getBoundingClientRect();
    const x = e.clientX || rect.left + rect.width * 0.5;
    const y = e.clientY || rect.top + rect.height * 0.45;
    pulseRing(x, y, 125, "#f2d593");
    burst(x, y, 28, 0.72, true);
  });

  /* HIGH-FPS DELTA-TIME CONFETTI + SHOCKWAVE RING ENGINE (Zero Idle Loops) */
  const canvas = $("fx");
  const ctx = canvas.getContext("2d", { alpha: true });

  let width = 0;
  let height = 0;
  let particles = [];
  let rings = [];
  let rafId = null;
  let lastTs = 0;

  const palette = [
    "#1ec96f",
    "#36e588",
    "#f2d593",
    "#fcf3de",
    "#dfbe78",
    "#115934",
    "#ffffff"
  ];

  function maxParticles() {
    return window.innerWidth < 640 ? 280 : 440;
  }

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener("resize", resizeCanvas, { passive: true });
  resizeCanvas();

  function ensureLoop() {
    if ((particles.length || rings.length) && rafId === null) {
      lastTs = performance.now();
      rafId = requestAnimationFrame(stepFrame);
    }
  }

  function pulseRing(x, y, maxRadius = 170, color = "#f2d593") {
    if (reducedMotion) return;
    rings.push({
      x,
      y,
      r: 14,
      maxR: maxRadius,
      alpha: 0.65,
      color
    });
    ensureLoop();
  }

  function drawStar(c, r) {
    c.beginPath();
    c.moveTo(0, -r);
    c.quadraticCurveTo(0, 0, r, 0);
    c.quadraticCurveTo(0, 0, 0, r);
    c.quadraticCurveTo(0, 0, -r, 0);
    c.quadraticCurveTo(0, 0, 0, -r);
    c.closePath();
    c.fill();
  }

  function burst(x, y, count = 130, spread = 1, starsBias = false) {
    if (reducedMotion) return;

    const cap = maxParticles();
    const n = Math.min(count, Math.max(0, cap - particles.length));
    if (n <= 0) return;

    for (let i = 0; i < n; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (Math.random() * 9.6 + 3.6) * spread;
      const roll = Math.random();
      const shape = starsBias
        ? (roll < 0.62 ? "s" : "c")
        : (roll < 0.16 ? "s" : roll < 0.34 ? "c" : "r");

      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 6.4 * spread,
        g: 0.16 + Math.random() * 0.1,
        w: 6 + Math.random() * 6.5,
        h: 3.4 + Math.random() * 3.8,
        r: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.24,
        tilt: Math.random() * Math.PI * 2,
        vt: 0.08 + Math.random() * 0.12,
        c: palette[(Math.random() * palette.length) | 0],
        shape,
        life: 95 + Math.random() * 48
      });
    }

    ensureLoop();
  }

  function stepFrame(now) {
    rafId = null;
    const dt = Math.min((now - lastTs) / 16.6667, 2.4);
    lastTs = now;

    ctx.clearRect(0, 0, width, height);

    const aliveRings = [];
    for (let i = 0; i < rings.length; i++) {
      const rg = rings[i];
      rg.r += (rg.maxR - rg.r) * 0.12 * dt + 1.4 * dt;
      rg.alpha -= 0.022 * dt;
      if (rg.alpha <= 0 || rg.r >= rg.maxR) continue;
      aliveRings.push(rg);

      ctx.save();
      ctx.beginPath();
      ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
      ctx.strokeStyle = rg.color;
      ctx.globalAlpha = Math.max(0, rg.alpha);
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.restore();
    }
    rings = aliveRings;

    const alive = [];
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.vy += p.g * dt;
      p.vx *= Math.pow(0.988, dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.r += p.vr * dt;
      p.tilt += p.vt * dt;
      p.life -= dt;

      if (p.life <= 0 || p.y > height + 36) continue;
      alive.push(p);

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.globalAlpha = Math.min(1, p.life / 26);
      ctx.fillStyle = p.c;

      if (p.shape === "s") {
        drawStar(ctx, p.h * 1.45);
      } else if (p.shape === "c") {
        ctx.beginPath();
        ctx.arc(0, 0, p.h * 0.78, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const tumble = Math.cos(p.tilt);
        ctx.fillRect(-p.w * 0.5, (-p.h * tumble) * 0.5, p.w, p.h * tumble);
      }

      ctx.restore();
    }

    particles = alive;

    if (particles.length > 0 || rings.length > 0) {
      rafId = requestAnimationFrame(stepFrame);
    } else {
      ctx.clearRect(0, 0, width, height);
    }
  }

  /* CELEBRATION REACTION (Multi-Wave Choreography) */
  const mainEl = $("main");
  const partyBtn = $("party");
  let celebrateTimer = null;
  let celebrateStep = 0;

  function triggerCelebrationPulse() {
    mainEl.classList.add("celebrating");
    partyBtn.classList.remove("pulse-pop");
    void partyBtn.offsetWidth;
    partyBtn.classList.add("pulse-pop");

    clearTimeout(celebrateTimer);
    celebrateTimer = setTimeout(() => {
      mainEl.classList.remove("celebrating");
    }, 1350);
  }

  partyBtn.addEventListener("click", () => {
    const rect = partyBtn.getBoundingClientRect();
    const originX = rect.left + rect.width * 0.5;
    const originY = rect.top + rect.height * 0.35;
    const mode = celebrateStep++ % 3;

    triggerCelebrationPulse();
    pulseRing(originX, originY, 185, "#f2d593");
    setTimeout(() => pulseRing(originX, originY, 145, "#36e588"), 90);

    if (mode === 0) {
      burst(originX, originY, 150, 1.15);
      setTimeout(() => burst(width * 0.16, height * 0.56, 80, 1), 160);
      setTimeout(() => burst(width * 0.84, height * 0.56, 80, 1), 300);
    } else if (mode === 1) {
      burst(width * 0.14, height * 0.62, 110, 1.15);
      burst(width * 0.86, height * 0.62, 110, 1.15);
      setTimeout(() => burst(width * 0.5, height * 0.34, 95, 1.05, true), 240);
    } else {
      burst(originX, originY, 110, 1.05, true);
      setTimeout(() => burst(width * 0.28, height * 0.38, 75, 1, true), 150);
      setTimeout(() => burst(width * 0.72, height * 0.38, 75, 1, true), 290);
      setTimeout(() => burst(width * 0.5, height * 0.25, 100, 1.15), 440);
    }

    if (navigator.vibrate) {
      navigator.vibrate([35, 30, 45]);
    }
  });

  /* GIFT OPENING SEQUENCE */
  const gate = $("gate");
  const giftBox = $("giftBox");
  const pageShell = $("pageShell");
  let opened = false;

  function openGift() {
    if (opened) return;
    opened = true;

    gate.setAttribute("aria-expanded", "true");
    gate.classList.add("is-opening");

    const boxRect = giftBox.getBoundingClientRect();
    const bx = boxRect.left + boxRect.width * 0.5;
    const by = boxRect.top + boxRect.height * 0.35;

    if (navigator.vibrate) {
      navigator.vibrate(55);
    }

    const revealDelay = reducedMotion ? 10 : 280;

    setTimeout(() => {
      pulseRing(bx || width * 0.5, by || height * 0.45, 220, "#f2d593");
      burst(bx || width * 0.5, by || height * 0.45, 190, 1.2);
      pageShell.removeAttribute("aria-hidden");
      document.title = "Happy Birthday — 17 · 11 · 2026";
      document.body.classList.add("open");
      startTyping();
    }, revealDelay);

    if (!reducedMotion) {
      setTimeout(() => burst(width * 0.2, height * 0.48, 85, 1), 780);
      setTimeout(() => burst(width * 0.8, height * 0.48, 85, 1), 1020);
      setTimeout(() => burst(width * 0.5, height * 0.3, 105, 1.05, true), 1380);
    }

    setTimeout(() => {
      gate.classList.add("is-gone");
    }, reducedMotion ? 80 : 1080);
  }

  gate.addEventListener("click", openGift);
  gate.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openGift();
    }
  });

  /* BACKGROUND TAP SPARKLES */
  window.addEventListener("pointerdown", e => {
    if (!document.body.classList.contains("open")) return;
    if (e.target.closest(".btn, .photo")) return;
    burst(e.clientX, e.clientY, 22, 0.65, true);
  }, { passive: true });
})();
</script>
